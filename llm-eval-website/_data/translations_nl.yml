page_title: LLM Overzicht
mission: "Om het verantwoord gebruik van LLM's te bevorderen, bieden wij een overzicht van modellen die ingezet kunnen worden voor Nederlandse gemeentelijke toepassingen."
energy_disclaimer:
  title: Energieverbruik Inschatten Onmogelijk
  explanation: "Omdat dit model niet open-source is, is het onmogelijk om te berekenen hoeveel energie het verbruikt. Als je je zorgen maakt over ons milieu, raden we je aan een model te gebruiken waarvoor deze informatie beschikbaar is."
copyright_footer: "Grip op LLMs, Gemeente Amsterdam"

score_explanation:
  factuality:
    intro: "
      We meten feitelijkheid met behulp van de milieuvriendelijke,
      kleine versies van drie benchmarks, namelijk
      <a href=https://huggingface.co/datasets/tinyBenchmarks/tinyMMLU target='_blank'>MMLU</a>,
      <a href=https://huggingface.co/datasets/tinyBenchmarks/tinyAI2_arc target='_blank'>ARC</a>, and
      <a href=https://huggingface.co/datasets/tinyBenchmarks/tinyTruthfulQA target='_blank'>TruthfulQA</a>.
      Deze benchmarks bestaan uit meerkeuzevragen zoals:"
    example: |
      Welke van de volgende wordt beschouwd als een zuuranhydride?
      A: HCl
      B: H2SO3
      C: SO2
      D: Al(NO3)3
    outro: "We kennen de antwoorden op deze vragen en kunnen berekenen hoe vaak het model correct heeft geantwoord."
  simplification:
    intro: "
      Wij meten de vereenvoudigingsvaardigheden met behulp van paren van complexe zinnen
      samen met hun bijbehorende eenvoudige versies -
      geschreven of gecontroleerd door experts en gebruikers.
      Bijvoorbeeld:"
    example: |
      Complex: Hierin is de ambitie vastgelegd om in Amsterdam voor 2030 tenminste 127 MW windenergie te realiseren.
      Simple: Hierin staat dat Amsterdam voor 2030 tenminste 127 MW aan windenergie wil kunnen opwekken.
    outro: "
      Wij vragen een LLM om elke complexe zin te vereenvoudigen.
      Daarna berekenen we hoe vergelijkbaar de vereenvoudiging is met die in het dataset."
  summarization:
    intro: "
      Wij meten samenvattingsvaardigheden met behulp van twee benchmarks, bekend als
      <a href=https://huggingface.co/datasets/EdinburghNLP/xsum target='_blank'>XSum</a> en
      <a href=https://huggingface.co/datasets/abisee/cnn_dailymail target='_blank'>CNN/DailyMail</a>.
      Deze benchmarks bevatten paren van nieuwsartikelen samen met een voorgestelde samenvatting.
      "
    example:
    outro: "
      Wij vragen een LLM om elk artikel samen te vatten.
      Daarna berekenen we hoe vergelijkbaar de samenvatting is met die in het dataset.
      "
  energy_use:
    intro: "
      We meten de impact van LLMs op het milieu met behulp van een tool genaamd CodeCarbon.
      Deze tool houdt bij hoe lang een programma draait en
      hoeveel rekenkracht en energie worden gebruikt.
      Vervolgens berekent het hoeveel koolstofdioxide er wordt uitgestoten,
      afhankelijk van het geografische gebied waar de servers zich bevinden.
      "
    example:
    outro: "
      Wij gebruiken CodeCarbon wanneer we alle andere benchmarks uitvoeren
      en berekenen vervolgens een gemiddelde score per model."
  data_openness:
    intro: "
      Open datasets maken het mogelijk om privacy- en auteursrechtelijke risico's te beoordelen.
      Ze helpen ons ook te controleren of de dataset onze samenleving en waarden weerspiegelt.
      We onderscheiden de volgende categorieën:"
    example: |
      <b>Open:</b> De provider van het model is volledig transparant over de trainingsgegevens. De datasets zijn openbaar beschikbaar en kunnen worden geïnspecteerd en geanalyseerd.

      <b>Beschreven:</b> De model is getraind op datasets die niet openbaar beschikbaar zijn. De aanbieder heeft belangrijke keuzes bij het verzamelen van de data en de belangrijkste eigenschappen ervan gedocumenteerd.

      <b>Gesloten:</b> De aanbieder heeft de training data niet gedeeld of beschreven. Hoogstens wordt de omvang van de dataset of minimale informatie over de aard van de onderliggende gegevens gedeeld (bijv. 'Webgegevens').
    outro:
